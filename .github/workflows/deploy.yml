
name: Deploy Online Bookstore to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::676968952728:role/GitHubBookstoreDeployRole
          aws-region: us-east-1

      - name: Create deployment package
        run: |
          zip -r bookstore.zip . \
            -x ".git/*" \
               ".github/*" \
               ".env" \
               "node_modules/*" \
               "bookstore.zip"

      - name: Upload and deploy to Elastic Beanstalk
        env:
          VERSION_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --query S3Bucket --output text)

          aws s3 cp bookstore.zip \
            "s3://${BUCKET}/bookstore-${VERSION_LABEL}.zip"

          aws elasticbeanstalk create-application-version \
            --application-name online-bookstore \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${BUCKET}",S3Key="bookstore-${VERSION_LABEL}.zip"

          aws elasticbeanstalk update-environment \
            --environment-name Online-bookstore-env \
            --version-label "${VERSION_LABEL}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names Online-bookstore-env
