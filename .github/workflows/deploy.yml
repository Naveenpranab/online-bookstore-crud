name: Deploy Bookstore to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Prepare deployment package
        run: zip -r bookstore.zip . -x ".git/*" ".github/*" ".env"

      - name: Deployment setup
        run: echo "AWS deployment credentials must be configured before deployment"
